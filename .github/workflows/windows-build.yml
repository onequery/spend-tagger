name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - spending_tagger_app.py
      - merge_transactions.py
      - requirements_macos_app.txt
      - ontology.json
      - .github/workflows/windows-build.yml

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_macos_app.txt pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SpendTagger spending_tagger_app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpendTagger-windows-exe
          path: dist/SpendTagger.exe
          if-no-files-found: error
          retention-days: 30
